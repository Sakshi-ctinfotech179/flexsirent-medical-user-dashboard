<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Card</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --teal: #0f7a72;
    --teal-dark: #0b5f59;
    --border-blue: #2f6fed;
    --text-muted: #8a94a6;
    --text-dark: #1f2937;
    --green-bg: #e8f7ee;
    --green-text: #1e9e5a;
    --red-bg: #fdeeee;
    --red-text: #e05353;
  }

  body{
    background: #f2f4f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .appt-card{
    background: #fff;
    border: 1px solid var(--border-blue);
    border-radius: 14px;
    padding: 1.25rem;
    max-width: 720px;
    margin: 3rem auto;
    box-shadow: 0 2px 10px rgba(20,30,60,0.05);
  }

  .clinic-img{
    width: 100%;
    height: 100%;
    min-height: 90px;
    object-fit: cover;
    border-radius: 10px;
  }

  .label{
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 0.15rem;
  }

  .clinic-name{
    font-weight: 700;
    color: var(--text-dark);
    font-size: 1rem;
    line-height: 1.25;
  }

  .clinic-loc{
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .schedule-date{
    font-weight: 700;
    color: var(--text-dark);
    font-size: 1rem;
  }

  .schedule-time{
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .btn-message{
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.55rem 1.25rem;
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    transition: background 0.2s ease;
  }
  .btn-message:hover{
    background: var(--teal-dark);
    color: #fff;
  }

  hr.divider{
    border-top: 1px solid #e9ecef;
    margin: 1.1rem 0 1rem 0;
  }

  .status-badge{
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--green-bg);
    color: var(--green-text);
    font-weight: 600;
    font-size: 0.85rem;
    padding: 0.3rem 0.75rem;
    border-radius: 999px;
  }

  .status-text{
    color: var(--text-muted);
    font-size: 0.85rem;
  }

  .btn-reschedule{
    border: 1px solid #cfd6e4;
    color: var(--text-dark);
    border-radius: 999px;
    background: #fff;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .btn-reschedule:hover{
    background: #f5f6f8;
    color: var(--text-dark);
  }

  .btn-cancel{
    border: 1px solid #f3c6c6;
    color: var(--red-text);
    background: var(--red-bg);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.85rem;
    font-weight: 500;
  }
  .btn-cancel:hover{
    background: #fbdcdc;
    color: var(--red-text);
  }

  /* ---------- Responsive tweaks ---------- */
  /* Phones and tablets in portrait (<768px): everything stacks, matches Bootstrap's md breakpoint */
  @media (max-width: 767.98px){
    .appt-card{
      margin: 1.25rem;
      padding: 1rem;
    }
    .clinic-img{
      min-height: 70px;
      margin-bottom: 0.5rem;
    }
    .top-row > [class*="col"]{
      margin-bottom: 0.75rem;
    }
    .btn-message{
      width: 100%;
      margin-top: 0.5rem;
    }
    .bottom-row{
      flex-direction: column;
      align-items: flex-start !important;
      gap: 0.75rem;
    }
    .bottom-actions{
      width: 100%;
      display: flex;
      gap: 0.5rem;
    }
    .bottom-actions .btn{
      flex: 1;
    }
  }

  /* Small phones only: reduce the 2-column split so labels don't crowd */
  @media (max-width: 400px){
    .top-row .col-6{
      width: 100%;
      max-width: 100%;
      flex: 0 0 100%;
    }
  }
</style>
</head>
<body>

<div class="container">
 
</div>

</body>
</html>
